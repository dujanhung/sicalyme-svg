name: validate SVG
on:
 workflow_dispatch:
 pull_request:
  paths:
   - "**.svg"
env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 LINK_XSD: https://www.w3.org/Graphics/SVG/1.1/DTD/svg11-flat-20110816.xsd
jobs:
 validate:
  runs-on: ubuntu-latest
  steps:
   - name: checkout repo
     uses: actions/checkout@v5
   - name: checkout svg-schema-validator repo
     uses: actions/checkout@v5
     with:
      repository: dujanhung/svg-schema-validator
      path: svg-schema-validator
   - name: setup Python
     uses: actions/setup-python@v6
     with:
      python-version: '3.14'
   - name: install XML lint
     run: pip install lxml
   - name: install CSS utility
     run: pip install cssutils
   - name: install XSD
     run: |
      curl -L $LINK_XSD -o svg11.xsd
   - name: validate
     run: |
      find . -type f -name "*.svg" -exec python svg-schema-validator/script.py $SVG_SCHEMA {} \;