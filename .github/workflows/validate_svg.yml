name: validate SVG
on:
 workflow_dispatch:
 pull_request:
  paths:
   - "**.svg"
env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
 validate:
  runs-on: ubuntu-latest
  steps:
   - name: checkout repo
     uses: actions/checkout@v5
   - name: checkout xml-schema-validator repo
     uses: actions/checkout@v5
     with:
      repository: dujanhung/xml-schema-validator
      path: xml-schema-validator
   - name: checkout xsd repo
     uses: actions/checkout@v5
     with:
      repository: dujanhung/xsd
      path: xsd
   - name: setup Python
     uses: actions/setup-python@v6
     with:
      python-version: '3.14'
   - name: install XML lint
     run: pip install lxml
   - name: install CSS utility
     run: pip install cssutils
   - name: validate
     run: |
      find . -type f -name "*.svg" -exec python xml-schema-validator/script.py xsd/files/svg.xsd {} svg \;