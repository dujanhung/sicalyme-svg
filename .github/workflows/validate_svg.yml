name: validate SVG
on:
 workflow_dispatch:
 pull_request:
  paths:
   - "**.svg"
env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 SVG_SCHEMA: https://www.w3.org/TR/SVG11/
jobs:
 validate:
  runs-on: ubuntu-latest
  steps:
   - name: checkout repo
     uses: actions/checkout@v5
   - name: checkout svg-schema-validator repo
     uses: actions/checkout@v5
     with:
      repository: dujanhung/svg-schema-validator
      path: svg-schema-validator
   - name: install XML lint
     run: pip install lxml
   - name: install CSS utility
     run: pip install cssutils
   - name: setup Python
     uses: actions/setup-python@v6
     with:
      python-version: '3.14'
   - name: validate
     run: |
      find . -type f -name "*.svg" -exec python svg-schema-validator/script.py {} \;